<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>注文・キッチン管理システム</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==================== 共通変数＆ベーススタイル ==================== */
    :root {
      --bg-color: #0f172a;          /* ディープスレート/ネイビー */
      --panel-bg: #1e293b;        /* カード・パネル背景 */
      --panel-border: #334155;    /* 境界線 */
      --text-main: #f8fafc;       /* 基本テキスト */
      --text-muted: #94a3b8;      /* 控えめなテキスト */
      
      --accent-gold: #f59e0b;     /* 主アクセント（ゴールド/オレンジ） */
      --accent-gold-hover: #d97706;
      
      --status-pending: #3b82f6;   /* 青: 未調理 */
      --status-completed: #10b981; /* 緑: 調理済み */
      --status-cancelled: #ef4444; /* 赤: キャンセル */
      
      --font-family: 'Noto Sans JP', sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ==================== バナー ==================== */
    .config-banner {
      background-color: #7c2d12;
      color: #fef08a;
      text-align: center;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .hidden { display: none !important; }

    /* ==================== ヘッダー ==================== */
    .app-header {
      background-color: #020617;
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon { font-size: 1.6rem; }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .view-switcher {
      display: flex;
      gap: 8px;
      background-color: var(--panel-bg);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--panel-border);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover { color: #fff; }
    .nav-btn.active {
      background-color: var(--accent-gold);
      color: #000;
    }

    .badge {
      background-color: var(--status-cancelled);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 900;
    }

    /* ==================== メインコンテナ ==================== */
    .app-container {
      flex: 1;
      padding: 20px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    .main-view {
      display: none;
    }
    .main-view.active {
      display: block;
    }

    /* ==================== ホール画面レイアウト ==================== */
    .hall-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .hall-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }

    .panel-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
      border-bottom: 2px solid var(--accent-gold);
      padding-bottom: 8px;
      display: inline-block;
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .required { color: var(--status-cancelled); font-size: 0.8rem; }

    /* 客番表示ディスプレイ */
    .customer-num-display-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      border: 2px solid var(--accent-gold);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 12px;
    }
    .customer-num-display-wrapper .prefix {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent-gold);
    }
    .customer-num-display {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
    }
    .btn-clear-num {
      background-color: var(--panel-border);
      color: var(--text-main);
      border: none;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }
    .btn-clear-num:hover { background-color: var(--status-cancelled); color: #fff; }

    /* 番号選択ボタン (1〜20) グリッド */
    .quick-num-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }

    .quick-num-btn {
      background-color: #0f172a;
      border: 1px solid var(--panel-border);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 12px 0;
      min-height: 48px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quick-num-btn:active { transform: scale(0.95); }
    .quick-num-btn:hover { 
      border-color: var(--accent-gold); 
      color: var(--accent-gold); 
      background-color: #1e293b;
    }

    /* メニューグリッド */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    .menu-card {
      background-color: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .menu-card:active { transform: scale(0.96); }
    .menu-card:hover { border-color: var(--accent-gold); }
    .menu-card .name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .menu-card .price { font-size: 0.85rem; color: var(--text-muted); }

    /* 選択商品リスト */
    .selected-items-container {
      background-color: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      padding: 12px;
      min-height: 90px;
    }
    .empty-msg {
      color: var(--text-muted);
      text-align: center;
      padding: 20px 0;
      font-size: 0.9rem;
    }

    .selected-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }
    .selected-item-row:last-child { border-bottom: none; }
    .selected-item-row .item-name { font-weight: 700; font-size: 1rem; }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-qty {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background-color: var(--panel-border);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-qty:hover { background-color: var(--accent-gold); color: #000; }
    .qty-value { font-weight: 900; font-size: 1.1rem; min-width: 24px; text-align: center; }

    #order-note {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    #order-note:focus { border-color: var(--accent-gold); }

    /* ボタン */
    .btn {
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      font-size: 1rem;
      min-height: 48px;
    }
    .btn-large {
      width: 100%;
      padding: 16px;
      font-size: 1.15rem;
    }
    .btn-primary {
      background-color: var(--accent-gold);
      color: #000;
    }
    .btn-primary:hover { background-color: var(--accent-gold-hover); }
    .btn-success {
      background-color: var(--status-completed);
      color: #fff;
    }
    .btn-success:hover { filter: brightness(1.1); }
    .btn-danger {
      background-color: var(--status-cancelled);
      color: #fff;
    }
    .btn-secondary {
      background-color: var(--panel-border);
      color: var(--text-main);
    }

    /* 提供待ちモニター */
    .ready-orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .ready-card {
      background-color: #0f172a;
      border: 2px solid var(--status-completed);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }
    .ready-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--panel-border);
      padding-bottom: 8px;
    }
    .ready-customer-num {
      font-size: 2rem;
      font-weight: 900;
      color: var(--status-completed);
    }
    .ready-card-items {
      list-style: none;
      margin-bottom: 12px;
    }
    .ready-card-items li {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* ==================== キッチン画面 ==================== */
    .tab-navigation {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--panel-border);
      padding-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      min-height: 44px;
    }

    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background-color: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .tab-count {
      background-color: rgba(0,0,0,0.25);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .kitchen-tab-content {
      display: none;
    }
    .kitchen-tab-content.active {
      display: block;
    }

    .orders-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* キッチン注文カード */
    .kitchen-card {
      background-color: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .kitchen-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-gold);
    }

    /* カード上部（客番を超大きく） */
    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--panel-border);
      padding-bottom: 8px;
    }

    .customer-badge-large {
      display: flex;
      flex-direction: column;
    }
    .customer-badge-large .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
    }
    .customer-badge-large .num {
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 1;
      color: var(--accent-gold);
    }

    .order-time-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      background-color: #0f172a;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }

    /* 商品リスト */
    .card-items-list {
      list-style: none;
      margin-bottom: 16px;
      flex: 1;
    }
    .card-items-list li {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 6px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.05);
    }
    .card-items-list .qty {
      color: var(--accent-gold);
      font-size: 1.3rem;
      font-weight: 900;
    }

    /* 備考 */
    .card-note {
      background-color: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--accent-gold);
      padding: 8px 12px;
      font-size: 0.95rem;
      color: var(--accent-gold);
      margin-bottom: 16px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .card-actions {
      margin-top: auto;
    }

    /* ==================== テーブル (履歴用) ==================== */
    .table-wrapper {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 600px;
    }

    .history-table th, .history-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .history-table th {
      background-color: #020617;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .history-table tr:hover {
      background-color: rgba(255,255,255,0.02);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .status-badge.pending { background-color: rgba(59, 130, 246, 0.2); color: var(--status-pending); }
    .status-badge.completed { background-color: rgba(16, 185, 129, 0.2); color: var(--status-completed); }
    .status-badge.cancelled { background-color: rgba(239, 68, 68, 0.2); color: var(--status-cancelled); }

    /* ==================== モーダル ==================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-small { max-width: 400px; }

    .modal-header {
      padding: 16px 20px;
      background-color: #020617;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
    }

    .modal-customer-badge {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .modal-customer-badge span {
      font-size: 1.8rem;
      color: var(--accent-gold);
      font-weight: 900;
      margin-left: 6px;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .divider {
      height: 1px;
      background-color: var(--panel-border);
      margin: 14px 0;
    }

    .modal-items-list {
      margin-top: 10px;
    }
    .modal-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 6px 0;
    }

    .modal-note-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
    }
    .modal-note-box .label { color: var(--text-muted); margin-right: 8px; }

    .cancel-reason-box {
      border-left: 3px solid var(--status-cancelled);
      margin-top: 12px;
      color: #fca5a5;
    }

    .modal-footer {
      padding: 16px 20px;
      background-color: #020617;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--panel-border);
    }

    .cancel-reasons-quick {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .chip-btn {
      background-color: #0f172a;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      min-height: 38px;
    }
    .chip-btn:hover { border-color: var(--accent-gold); }

    .text-input {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    /* ==================== スマホ向けレスポンシブ調整 ==================== */
    @media (max-width: 900px) {
      .hall-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .app-header {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
        padding: 10px 14px;
      }

      .brand {
        justify-content: center;
      }

      .view-switcher {
        width: 100%;
      }

      .nav-btn {
        flex: 1;
        justify-content: center;
        padding: 10px 8px;
        font-size: 0.9rem;
      }

      .app-container {
        padding: 12px;
      }

      .hall-panel {
        padding: 16px;
      }

      .quick-num-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .quick-num-btn {
        font-size: 1.1rem;
        min-height: 44px;
      }

      .menu-grid {
        grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
        gap: 8px;
      }

      .orders-card-grid {
        grid-template-columns: 1fr;
      }

      .modal-footer {
        flex-direction: column-reverse;
      }

      .modal-footer .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Firebase Config Banner (未設定時の警告) -->
  <div id="config-warning" class="config-banner hidden">
    ⚠️ Firebase設定（firebaseConfig）を入力するとクラウド同期が有効化されます。（現在はデモ/ローカル動作中）
  </div>

  <!-- ヘッダー / モード切替 -->
  <header class="app-header">
    <div class="brand">
      <span class="logo-icon"></span>
      <h1>いも庵</h1>
    </div>
    <nav class="view-switcher">
      <button id="btn-view-hall" class="nav-btn active" onclick="switchMainView('hall')">
        <span class="icon"></span> レジ画面
      </button>
      <button id="btn-view-kitchen" class="nav-btn" onclick="switchMainView('kitchen')">
        <span class="icon"></span> キッチン画面
        <span id="pending-badge" class="badge">0</span>
      </button>
    </nav>
  </header>

  <main class="app-container">

    <!-- ==================== ホール画面 ==================== -->
    <section id="view-hall" class="main-view active">
      <div class="hall-layout">
        
        <!-- 左側：注文入力フォーム -->
        <div class="hall-panel order-form-panel">
          <h2 class="panel-title">新規注文入力</h2>
          
          <!-- 客番選択エリア（1〜20のタップ選択式） -->
          <div class="form-group">
            <label>客番（番号札）の選択 <span class="required">必須</span></label>

  <!-- JavaScript Logic (ES Modules) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      doc, 
      onSnapshot, 
      serverTimestamp, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ ご自身のFirebaseプロジェクトの設定情報に置き換えてください
    const firebaseConfig = {
      apiKey: "AIzaSyD95xpKH5T5kSPMY_sAKUBcJ_1_4KbXqNU",
      authDomain: "imoan-9fe48.firebaseapp.com",
      projectId: "imoan-9fe48",
      storageBucket: "imoan-9fe48.firebasestorage.app",
      messagingSenderId: "625195150923",
      appId: "1:625195150923:web:98c3fc771d9956dafb67ce"
    };

    let db = null;
    let useFirebase = false;

    // Firebase設定の簡易検証
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        useFirebase = true;
        console.log("🔥 Firebase Firestore connected!");
      } catch (err) {
        console.error("Firebase Initialization Error:", err);
      }
    } else {
      document.getElementById("config-warning").classList.remove("hidden");
    }

    // 店舗メニュー定義 & アプリ内状態管理
    const MENU_ITEMS = [
      { id: 'm1', name: 'かき氷 もも', price: 1300 },
      { id: 'm2', name: 'かき氷 芋', price: 850 },
      { id: 'm3', name: 'かき氷 苺', price: 600 },
      { id: 'm4', name: '冷やし芋', price: 400 },
      { id: 'm5', name: 'シェイク', price: 500 },
      { id: 'm6', name: 'ソフト', price: 450 },
      { id: 'm7', name: '冷凍芋', price: 440 },
      { id: 'm8', name: '犬用干し芋', price: 500 },
      { id: 'm9', name: 'おさつチップ', price: 430},
    ];

    let selectedCustomerNumStr = ""; // 選択中の客番文字列
    let currentOrderDraft = [];     // { productName, quantity, price }
    let allOrders = [];             // 全注文データ保持用
    let activeCancelTargetId = null;

    // LocalStorageフォールバック用キー（Firebase未接続時）
    const LOCAL_STORAGE_KEY = 'restaurant_orders_demo_db';

    // 初期化処理
    document.addEventListener("DOMContentLoaded", () => {
      renderMenuGrid();
      setupRealtimeSync();

      // グローバル関数をwindowに紐付け (HTMLからのonclick用)
      window.switchMainView = switchMainView;
      window.switchKitchenTab = switchKitchenTab;
      window.submitOrder = submitOrder;
      window.markAsCompleted = markAsCompleted;
      window.openCancelPrompt = openCancelPrompt;
      window.closeCancelPrompt = closeCancelPrompt;
      window.setCancelReason = setCancelReason;
      window.confirmCancelOrder = confirmCancelOrder;
      window.openOrderDetailModal = openOrderDetailModal;
      window.closeModal = closeModal;
      window.closeModalOnOverlay = closeModalOnOverlay;
      window.markAsDelivered = markAsDelivered;
      window.setCustomerNum = setCustomerNum;
      window.clearCustomerNum = clearCustomerNum;
    });

    // 客番選択
    function updateCustomerNumDisplay() {
      const displayEl = document.getElementById("customer-num-display");
      displayEl.innerText = selectedCustomerNumStr || "--";
    }

    function setCustomerNum(numStr) {
      selectedCustomerNumStr = numStr;
      updateCustomerNumDisplay();
    }

    function clearCustomerNum() {
      selectedCustomerNumStr = "";
      updateCustomerNumDisplay();
    }

    // メニュー表示 & 下書き操作
    function renderMenuGrid() {
      const container = document.getElementById("menu-grid");
      container.innerHTML = MENU_ITEMS.map(item => `
        <div class="menu-card" onclick="addMenuItem('${item.name}', ${item.price})">
          <div class="name">${item.name}</div>
          <div class="price">¥${item.price}</div>
        </div>
      `).join('');
    }

    window.addMenuItem = function(name, price) {
      const existing = currentOrderDraft.find(i => i.productName === name);
      if (existing) {
        existing.quantity++;
      } else {
        currentOrderDraft.push({ productName: name, quantity: 1, price });
      }
      renderSelectedItems();
    };

    window.changeQty = function(name, delta) {
      const idx = currentOrderDraft.findIndex(i => i.productName === name);
      if (idx !== -1) {
        currentOrderDraft[idx].quantity += delta;
        if (currentOrderDraft[idx].quantity <= 0) {
          currentOrderDraft.splice(idx, 1);
        }
      }
      renderSelectedItems();
    };

    function renderSelectedItems() {
      const container = document.getElementById("selected-items-list");
      if (currentOrderDraft.length === 0) {
        container.innerHTML = '<p class="empty-msg">商品を選択してください</p>';
        return;
      }

      container.innerHTML = currentOrderDraft.map(item => `
        <div class="selected-item-row">
          <span class="item-name">${item.productName}</span>
          <div class="qty-controls">
            <button type="button" class="btn-qty" onclick="changeQty('${item.productName}', -1)">-</button>
            <span class="qty-value">${item.quantity}</span>
            <button type="button" class="btn-qty" onclick="changeQty('${item.productName}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    // 注文確定
    async function submitOrder() {
      const noteInput = document.getElementById("order-note");

      if (!selectedCustomerNumStr) {
        alert("客番（番号札）を選択してください。");
        return;
      }

      if (currentOrderDraft.length === 0) {
        alert("商品を選択してください。");
        return;
      }

      const newOrder = {
        customerNumber: selectedCustomerNumStr,
        items: [...currentOrderDraft],
        note: noteInput.value.trim() || "",
        status: 'pending',
        createdAt: useFirebase ? serverTimestamp() : new Date().toISOString(),
        completedAt: null,
        cancelledAt: null,
        cancelReason: null,
        delivered: false
      };

      try {
        if (useFirebase) {
          await addDoc(collection(db, "orders"), newOrder);
        } else {
          const localData = getLocalOrders();
          newOrder.id = 'local_' + Date.now();
          localData.push(newOrder);
          saveLocalOrders(localData);
          triggerLocalSync();
        }

        const targetCustomerNum = selectedCustomerNumStr;
        clearCustomerNum();
        noteInput.value = "";
        currentOrderDraft = [];
        renderSelectedItems();

        alert(`客番 ${targetCustomerNum} の注文を送信しました！`);
      } catch (err) {
        console.error("注文保存エラー:", err);
        alert("注文の保存に失敗しました。");
      }
    }

    // リアルタイム同期
    function setupRealtimeSync() {
      if (useFirebase) {
        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
          allOrders = snapshot.docs.map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }));
          renderAllViews();
        });
      } else {
        allOrders = getLocalOrders();
        renderAllViews();

        window.addEventListener('storage', (e) => {
          if (e.key === LOCAL_STORAGE_KEY) {
            allOrders = getLocalOrders();
            renderAllViews();
          }
        });
      }
    }

    function triggerLocalSync() {
      allOrders = getLocalOrders();
      renderAllViews();
      window.dispatchEvent(new Event('storage'));
    }

    function getLocalOrders() {
      const str = localStorage.getItem(LOCAL_STORAGE_KEY);
      return str ? JSON.parse(str) : [];
    }
    function saveLocalOrders(orders) {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(orders));
    }

    // 画面更新
    function renderAllViews() {
      const pendingOrders = allOrders.filter(o => o.status === 'pending');
      const completedOrders = allOrders.filter(o => o.status === 'completed');
      const cancelledOrders = allOrders.filter(o => o.status === 'cancelled');

      document.getElementById("pending-badge").innerText = pendingOrders.length;
      document.getElementById("count-pending").innerText = pendingOrders.length;
      document.getElementById("count-completed").innerText = completedOrders.length;
      document.getElementById("count-history").innerText = allOrders.length;
      document.getElementById("count-cancelled").innerText = cancelledOrders.length;

      renderKitchenCards("cards-pending", pendingOrders, true);
      renderKitchenCards("cards-completed", completedOrders, false);
      renderKitchenCards("cards-cancelled", cancelledOrders, false, true);
      renderHistoryTable(allOrders);
      renderReadyMonitor(completedOrders.filter(o => !o.delivered));
    }

    function renderKitchenCards(containerId, orders, isPending, isCancelled = false) {
      const container = document.getElementById(containerId);
      if (orders.length === 0) {
        container.innerHTML = '<p class="empty-msg">該当する注文はありません</p>';
        return;
      }

      container.innerHTML = orders.map(o => {
        const timeStr = formatTimestamp(o.createdAt);
        const itemsHtml = o.items.map(i => `
          <li>
            <span>${i.productName}</span>
            <span class="qty">×${i.quantity}</span>
          </li>
        `).join('');

        const noteHtml = o.note ? `<div class="card-note">備考: ${escapeHtml(o.note)}</div>` : '';
        const cancelReasonHtml = (isCancelled && o.cancelReason) 
          ? `<div class="card-note" style="border-color:var(--status-cancelled); color:#fca5a5;">理由: ${escapeHtml(o.cancelReason)}</div>` 
          : '';

        return `
          <div class="kitchen-card" onclick="openOrderDetailModal('${o.id}')">
            <div>
              <div class="card-top-bar">
                <div class="customer-badge-large">
                  <span class="label">客番</span>
                  <span class="num">${o.customerNumber}</span>
                </div>
                <span class="order-time-tag">${timeStr} 注文</span>
              </div>
              <ul class="card-items-list">
                ${itemsHtml}
              </ul>
              ${noteHtml}
              ${cancelReasonHtml}
            </div>
            <div class="card-actions" onclick="event.stopPropagation()">
              ${isPending ? `
                <button class="btn btn-success btn-large" onclick="markAsCompleted('${o.id}')">
                  調理済みにする
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderHistoryTable(orders) {
      const tbody = document.getElementById("history-table-body");
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">注文履歴がありません</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(o => {
        const itemsSummary = o.items.map(i => `${i.productName}×${i.quantity}`).join(', ');
        const createdStr = formatTimestamp(o.createdAt);
        const completedStr = formatTimestamp(o.completedAt);
        
        let statusClass = 'pending';
        let statusLabel = '未調理';
        if (o.status === 'completed') { statusClass = 'completed'; statusLabel = '調理済み'; }
        if (o.status === 'cancelled') { statusClass = 'cancelled'; statusLabel = 'キャンセル'; }

        return `
          <tr onclick="openOrderDetailModal('${o.id}')" style="cursor:pointer;">
            <td><strong>No.${o.customerNumber}</strong></td>
            <td>${itemsSummary}</td>
            <td>${createdStr}</td>
            <td>${completedStr}</td>
            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
            <td><button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem; min-height:auto;">詳細</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderReadyMonitor(completedOrders) {
      const container = document.getElementById("ready-orders-list");
      if (completedOrders.length === 0) {
        container.innerHTML = '<p class="empty-msg">現在、配膳待ちの料理はありません</p>';
        return;
      }

      container.innerHTML = completedOrders.map(o => {
        const itemsSummary = o.items.map(i => `<li>${i.productName} ×${i.quantity}</li>`).join('');
        return `
          <div class="ready-card">
            <div class="ready-card-header">
              <span class="ready-customer-num">${o.customerNumber}番</span>
              <span class="status-badge completed">調理完了</span>
            </div>
            <ul class="ready-card-items">
              ${itemsSummary}
            </ul>
            <button class="btn btn-primary" style="width:100%;" onclick="markAsDelivered('${o.id}')">
              提供完了 (画面から消去)
            </button>
          </div>
        `;
      }).join('');
    }

    // ステータス更新
    async function updateOrderStatus(orderId, updateData) {
      try {
        if (useFirebase) {
          const orderRef = doc(db, "orders", orderId);
          await updateDoc(orderRef, updateData);
        } else {
          const localData = getLocalOrders();
          const idx = localData.findIndex(o => o.id === orderId);
          if (idx !== -1) {
            localData[idx] = { ...localData[idx], ...updateData };
            saveLocalOrders(localData);
            triggerLocalSync();
          }
        }
      } catch (err) {
        console.error("ステータス更新エラー:", err);
        alert("更新に失敗しました。");
      }
    }

    async function markAsCompleted(orderId) {
      const updateData = {
        status: 'completed',
        completedAt: useFirebase ? serverTimestamp() : new Date().toISOString()
      };
      await updateOrderStatus(orderId, updateData);
      closeModal();
    }

    async function markAsDelivered(orderId) {
      await updateOrderStatus(orderId, { delivered: true });
    }

    // モーダル制御
    function openOrderDetailModal(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      document.getElementById("modal-customer-num").innerText = order.customerNumber;
      document.getElementById("modal-created-time").innerText = `注文時刻: ${formatTimestamp(order.createdAt)}`;
      document.getElementById("modal-note-text").innerText = order.note || "なし";

      const statusBadge = document.getElementById("modal-status-badge");
      statusBadge.className = `status-badge ${order.status}`;
      statusBadge.innerText = order.status === 'pending' ? '未調理' : (order.status === 'completed' ? '調理済み' : 'キャンセル');

      document.getElementById("modal-items-list").innerHTML = order.items.map(i => `
        <div class="modal-item-row">
          <span>${i.productName}</span>
          <span>× ${i.quantity}</span>
        </div>
      `).join('');

      const cancelBox = document.getElementById("modal-cancel-reason-box");
      if (order.status === 'cancelled' && order.cancelReason) {
        cancelBox.classList.remove("hidden");
        document.getElementById("modal-cancel-reason-text").innerText = order.cancelReason;
      } else {
        cancelBox.classList.add("hidden");
      }

      const footerActions = document.getElementById("modal-footer-actions");
      let actionBtns = `<button class="btn btn-secondary" onclick="closeModal()">閉じる</button>`;

      if (order.status === 'pending') {
        actionBtns += `
          <button class="btn btn-danger" onclick="openCancelPrompt('${order.id}')">キャンセル</button>
          <button class="btn btn-success" onclick="markAsCompleted('${order.id}')">調理済みにする</button>
        `;
      } else if (order.status === 'completed') {
        actionBtns += `
          <button class="btn btn-danger" onclick="openCancelPrompt('${order.id}')">キャンセル</button>
        `;
      }

      footerActions.innerHTML = actionBtns;
      document.getElementById("modal-detail").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal-detail").classList.add("hidden");
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === "modal-detail") closeModal();
    }

    function openCancelPrompt(orderId) {
      activeCancelTargetId = orderId;
      document.getElementById("cancel-reason-input").value = "";
      document.getElementById("modal-cancel-prompt").classList.remove("hidden");
    }

    function closeCancelPrompt() {
      activeCancelTargetId = null;
      document.getElementById("modal-cancel-prompt").classList.add("hidden");
    }

    function setCancelReason(text) {
      document.getElementById("cancel-reason-input").value = text;
    }

    async function confirmCancelOrder() {
      if (!activeCancelTargetId) return;

      const reason = document.getElementById("cancel-reason-input").value.trim() || "理由なし";
      
      const updateData = {
        status: 'cancelled',
        cancelledAt: useFirebase ? serverTimestamp() : new Date().toISOString(),
        cancelReason: reason
      };

      await updateOrderStatus(activeCancelTargetId, updateData);
      closeCancelPrompt();
      closeModal();
    }

    // 画面・タブ切替
    function switchMainView(viewName) {
      document.querySelectorAll(".main-view").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));

      if (viewName === 'hall') {
        document.getElementById("view-hall").classList.add("active");
        document.getElementById("btn-view-hall").classList.add("active");
      } else {
        document.getElementById("view-kitchen").classList.add("active");
        document.getElementById("btn-view-kitchen").classList.add("active");
      }
    }

    function switchKitchenTab(tabName) {
      document.querySelectorAll(".kitchen-tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));

      document.getElementById(`tab-${tabName}`).classList.add("active");
      if (event && event.currentTarget) {
        event.currentTarget.classList.add("active");
      }
    }

    // ユーティリティ
    function formatTimestamp(ts) {
      if (!ts) return "--:--";
      let date;
      if (ts.toDate) {
        date = ts.toDate();
      } else if (typeof ts === 'string') {
        date = new Date(ts);
      } else {
        return "--:--";
      }
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
